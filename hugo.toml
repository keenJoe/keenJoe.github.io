baseURL = "https://keenjoe.github.io/"
title = "KeenJoe's Blog"
theme = "PaperMod"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
paginate = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
description = "KeenJoe 的技术博客"
author = "KeenJoe"
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
hidemeta = false
hideSummary = false
showtoc = true

  [params.homeInfoParams]
  Title = "Hey, I'm KeenJoe"
  Content = "欢迎来到我的技术博客。这里记录我的技术思考、学习笔记和实践经验。"

  [[params.socialIcons]]
  name = "github"
  url = "https://github.com/keenJoe"

[params.editPost]
URL = "https://github.com/keenJoe/keenJoe.github.io/tree/main/content"
Text = "Suggest Changes"
appendFilePath = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[[menu.main]]
identifier = "home"
name = "首页"
url = "/"
weight = 1

[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 5

[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 15

[[menu.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 20

[markup]
  [markup.highlight]
  anchorLineNos = false
  codeFences = true
  guessSyntax = true
  lineNos = false
  noClasses = true
  style = "monokai"
