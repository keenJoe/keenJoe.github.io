baseURL: https://keenjoe.github.io/
title: KeenJoe's Blog
languageCode: zh-cn
defaultContentLanguage: zh
paginate: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - identifier: blog
      name: 博客
      pageRef: /blog
      weight: 1
    - identifier: tags
      name: 标签
      pageRef: /tags
      weight: 2
    - identifier: about
      name: 关于
      pageRef: /about
      weight: 3
    - name: 搜索
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: https://github.com/keenJoe
      params:
        icon: github

params:
  description: KeenJoe 的技术博客 —— 记录技术思考、学习笔记和实践经验
  displayUpdatedDate: true
  dateFormat: "2006年1月2日"

  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system
    displayToggle: true

  page:
    width: normal

  editURL:
    enable: true
    base: https://github.com/keenJoe/keenJoe.github.io/edit/main/content

  blog:
    list:
      displayTags: true
    article:
      displayPagination: true

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  highlight:
    copy:
      enable: true

markup:
  highlight:
    noClasses: false

  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
